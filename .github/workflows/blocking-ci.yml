name: blocking-ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: blocking-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  repository-policy:
    name: Repository policy and base contract
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install the pinned Python toolchain runner
        # `make check` invokes ruff and mypy through `uv tool run` at versions pinned in
        # the Makefile, so the gate needs uv itself and nothing else. pipx ships on the
        # runner image; the version is frozen so CI and a developer run the same tools.
        run: pipx install uv==0.12.5
      - name: Run the local merge gate
        run: make check

  required:
    name: CI required
    if: ${{ always() }}
    needs: [repository-policy]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require successful dependencies
        env:
          POLICY_RESULT: ${{ needs.repository-policy.result }}
        run: |
          test "$POLICY_RESULT" = success || {
            echo "Repository policy result: $POLICY_RESULT"
            exit 1
          }
