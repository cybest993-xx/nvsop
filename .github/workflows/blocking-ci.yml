name: blocking-ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: blocking-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  scope:
    name: Change scope
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
      force_all: ${{ steps.scope.outputs.force_all }}
      integration: ${{ steps.scope.outputs.integration }}
      browser: ${{ steps.scope.outputs.browser }}
      media: ${{ steps.scope.outputs.media }}
    steps:
      - name: Checkout candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Select applicable gates
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          # 与后续作业验证的候选树一致；PR 使用 GitHub 的合并提交。
          HEAD_SHA: ${{ github.sha }}
        run: python3 scripts/ci_scope.py "$BASE_SHA" "$HEAD_SHA" >> "$GITHUB_OUTPUT"
      - name: Validate scope outputs
        env:
          DOCS_ONLY: ${{ steps.scope.outputs.docs_only }}
          FORCE_ALL: ${{ steps.scope.outputs.force_all }}
          INTEGRATION: ${{ steps.scope.outputs.integration }}
          BROWSER: ${{ steps.scope.outputs.browser }}
          MEDIA: ${{ steps.scope.outputs.media }}
        run: |
          set -euo pipefail
          for value in "$DOCS_ONLY" "$FORCE_ALL" "$INTEGRATION" "$BROWSER" "$MEDIA"; do
            case "$value" in true|false) ;; *) echo "Invalid CI scope output: $value" >&2; exit 1 ;; esac
          done
          if [ "$DOCS_ONLY" = true ] && [ "$FORCE_ALL:$INTEGRATION:$BROWSER:$MEDIA" != false:false:false:false ]; then
            echo "Documentation fast lane cannot select another gate." >&2
            exit 1
          fi
          if [ "$FORCE_ALL" = true ] && [ "$DOCS_ONLY:$INTEGRATION:$BROWSER:$MEDIA" != false:true:true:true ]; then
            echo "force_all must select every blocking family." >&2
            exit 1
          fi
          if [ "$MEDIA" = true ] && { [ "$INTEGRATION" != true ] || [ "$BROWSER" != true ]; }; then
            echo "Media changes require integration and browser evidence." >&2
            exit 1
          fi

  # 两份锁文件始终检查，文档快线也不能绕过冻结依赖约束。
  lockfile:
    name: Lockfile cleanliness
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install the pinned Python toolchain runner
        run: pipx install uv==0.12.5
      - name: Require uv.lock to match pyproject.toml
        # `--check` resolves without writing. `uv sync --frozen` is not a substitute: it
        # declines to update the lockfile rather than comparing it to the manifest, so a
        # manifest edit with a stale lockfile installs the old resolution and passes.
        run: make lockfile
      - name: Set up the pinned Node runtime and package manager
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          # `.nvmrc`, the same file a developer's `nvm use` reads — one place the runtime
          # version is chosen, as `.python-version` is for the backend. `package.json`'s
          # `engines.node` is a floor rather than a pin and would let CI silently move to a
          # newer Node than anyone has run locally.
          node-version-file: .nvmrc
      - name: Install the pinned package manager
        # `corepack` reads `packageManager` from `package.json`, so the pnpm version comes from
        # the same manifest a developer's shell reads and not from a second pin here.
        run: corepack enable pnpm && corepack install
      - name: Require pnpm-lock.yaml to match the web manifests
        # The same rule as `uv.lock` above, for the web workspace: `--frozen-lockfile` fails on
        # a manifest whose lockfile was never regenerated. `--lockfile-only` stops before
        # writing any package to disk, since this job is about the lockfile and not about
        # having an installed tree.
        run: pnpm install --frozen-lockfile --lockfile-only

  # 文档与代码使用各自的完整 Make 门禁，共享政策和敏感信息检查。
  merge-gate:
    name: Repository checks
    needs: scope
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install pinned workflow linter
        if: needs.scope.outputs.force_all == 'true'
        run: make ci-tools
      - name: Lint GitHub Actions workflows
        if: needs.scope.outputs.force_all == 'true'
        run: make ci-lint
      - name: Install the pinned Python toolchain runner
        # `make check` starts by running `uv sync --frozen`, which provisions the interpreter
        # named by `.python-version` and installs every dependency and gate tool from
        # `uv.lock`. uv itself is all this step provides — no separate Python setup action,
        # which would be a second place the interpreter version is chosen. Its version is
        # frozen so CI and a developer run the same build of ruff and mypy.
        run: pipx install uv==0.12.5
      - name: Set up the pinned Node runtime
        if: needs.scope.outputs.docs_only == 'false'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
      - name: Install the pinned package manager
        id: pnpm
        if: needs.scope.outputs.docs_only == 'false'
        # `corepack` reads `packageManager` from `package.json`, so pnpm's version comes from
        # the manifest rather than from a second pin here. After the Node step, because the
        # shim it writes belongs to that interpreter. The store path is asked of pnpm rather
        # than hard-coded, so a release that moves it does not silently leave the next step
        # caching an empty directory.
        run: |
          set -euo pipefail
          corepack enable pnpm
          corepack install
          echo "store=$(pnpm store path)" >> "$GITHUB_OUTPUT"
      - name: Restore the pnpm store
        if: needs.scope.outputs.docs_only == 'false'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          # Not `setup-node`'s own `cache: pnpm`, which resolves the store path before the step
          # above has put pnpm on PATH.
          path: ${{ steps.pnpm.outputs.store }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-
      - name: Run the documentation gate
        if: needs.scope.outputs.docs_only == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: make check-docs BASE="$BASE_SHA" HEAD="$HEAD_SHA"
      - name: Run the local merge gate
        if: needs.scope.outputs.docs_only == 'false'
        env:
          # The OpenAPI compatibility check must compare with the actual PR base, not whatever
          # branch name happens to be checked out as origin/main.
          OPENAPI_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: make check
      - name: Report change size for review
        if: needs.scope.outputs.docs_only == 'false' && github.event_name == 'pull_request'
        # Harness §5：从共同祖先计算到 PR HEAD，行数只作提示。
        # Git 或文件读取失败仍须使本步骤失败。
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: make change-size BASE="$BASE_SHA" HEAD="$HEAD_SHA"
      - name: Verify a clean worktree
        # Generated output is regenerated in the same change as its source (harness §5). If
        # the gate wrote anything — a re-resolved lockfile, a formatter fixing a file, or a new
        # generated file not present in the change — the change is incomplete. `git diff` alone
        # misses untracked output, so inspect the complete porcelain status too.
        run: |
          set -euo pipefail
          git diff --exit-code
          if [ -n "$(git status --porcelain=v1 --untracked-files=all)" ]; then
            git status --short --untracked-files=all
            exit 1
          fi

  # Real local infrastructure: center integration/system flows plus MediaMTX when its owning
  # inputs changed. The shared selector decides applicability once; skipped suites are explicit.
  integration-gate:
    name: Center and cross-app system evidence
    needs: scope
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install the pinned Python toolchain runner
        if: needs.scope.outputs.integration == 'true'
        run: pipx install uv==0.12.5
      - name: Install media test tools
        if: needs.scope.outputs.integration == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg=7:6.1.1-3ubuntu5
          command -v ffmpeg
          command -v ffprobe
      - name: Run the integration suite
        if: needs.scope.outputs.integration == 'true'
        # Docker is present on the GitHub-hosted runner, which is what testcontainers uses to
        # start PostgreSQL. No service container is declared here: the suite owns the image
        # tag and the lifecycle, so a developer runs the same database CI does.
        run: make check-integration
      - name: Run real MediaMTX recording and playback evidence
        if: needs.scope.outputs.media == 'true'
        run: make media-system
      - name: Explicit success with nothing to check
        if: needs.scope.outputs.integration == 'false'
        run: echo "No paths the integration suite reads were changed."

  # Family 4 (harness §7): SYS-22-07 in the two branded browser families the product supports.
  # Component tests remain in `make check`; this job proves actual layout, keyboard focus, and
  # the supported viewport endpoints in stable Chrome and Edge.
  browser-gate:
    name: Chrome and Edge system evidence
    needs: scope
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up the pinned Node runtime
        if: needs.scope.outputs.browser == 'true'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
      - name: Install the pinned package manager and workspace
        if: needs.scope.outputs.browser == 'true'
        run: |
          set -euo pipefail
          corepack enable pnpm
          corepack install
          pnpm install --frozen-lockfile
      - name: Install stable Chrome and Edge
        if: needs.scope.outputs.browser == 'true'
        run: pnpm --filter control-web exec playwright install --with-deps chrome msedge
      - name: Install WHEP media test tool
        if: needs.scope.outputs.media == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg=7:6.1.1-3ubuntu5
          command -v ffmpeg
      - name: Run SYS-22-07 in branded browsers
        if: needs.scope.outputs.browser == 'true'
        env:
          PLAYWRIGHT_BRANDED: "1"
        run: make web-e2e
      - name: Run real MediaMTX WHEP evidence
        if: needs.scope.outputs.media == 'true'
        env:
          PLAYWRIGHT_BRANDED: "1"
        run: make web-e2e-whep
      - name: Upload failed browser evidence
        if: failure() && needs.scope.outputs.browser == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: .nvsop/artifacts/web/test-results/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
      - name: Explicit success with nothing to check
        if: needs.scope.outputs.browser == 'false'
        run: echo "No paths the browser suite reads were changed."

  required:
    name: CI required
    if: ${{ always() }}
    needs: [scope, lockfile, merge-gate, integration-gate, browser-gate]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require successful dependencies
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          LOCKFILE_RESULT: ${{ needs.lockfile.result }}
          GATE_RESULT: ${{ needs.merge-gate.result }}
          INTEGRATION_RESULT: ${{ needs.integration-gate.result }}
          BROWSER_RESULT: ${{ needs.browser-gate.result }}
        run: |
          set -euo pipefail
          status=0
          for pair in "scope:$SCOPE_RESULT" "lockfile:$LOCKFILE_RESULT" "merge-gate:$GATE_RESULT" \
            "integration-gate:$INTEGRATION_RESULT" "browser-gate:$BROWSER_RESULT"; do
            name=${pair%%:*}
            result=${pair#*:}
            echo "$name: $result"
            test "$result" = success || status=1
          done
          exit $status
