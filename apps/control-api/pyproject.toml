[project]
name = "control-api"
version = "0.1.0"
description = "Center backend: management and aggregation plane for the SOP compliance system."
requires-python = ">=3.12"

# The center backend is anchored to Python 3.12 with a committed `.python-version` and
# `uv.lock` (solution-and-roadmap.md §六). Version floors here; the exact resolution is
# frozen in the lockfile at the repository root, and CI installs with `uv sync --frozen`.
dependencies = [
    # Argon2id for passwords (§六). `argon2-cffi` is the reference binding to the C
    # implementation by the Argon2 authors; the parameters we run it with are named
    # explicitly in `factory_sop/auth/passwords.py` rather than taken from its defaults.
    "argon2-cffi>=25.1.0",
    "fastapi>=0.121.2",
    "pydantic-settings>=2.12.0",
    "structlog>=25.5.0",
    "uvicorn>=0.38.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# Formatting, lint, type and boundary configuration is the repository root's
# `pyproject.toml`. A second copy here would drift silently: the gate runs the root
# configuration, so only the root one is ever enforced.
