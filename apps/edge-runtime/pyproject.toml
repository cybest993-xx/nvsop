[project]
name = "edge-runtime"
version = "0.1.0"
description = "Inference-host autonomous judgment unit: judgment core, boundary solver, supervisor."
requires-python = ">=3.11"
dependencies = []

# Python 3.11 提供事件穷尽检查所需的 typing.assert_never（docs/engineering/coding.md）。
# 判定核心运行在 supervisor，不在基座容器；标准库边界与 uv 工作区隔离见仓库架构和 ADR-0005。
# 检查工具由根 uv.lock 冻结，Makefile 提供稳定命令入口；本包不另建锁文件。

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
# No `PT`: that family argues for pytest-style bare asserts, and this package has no
# pytest — it is standard-library-only, so its tests are stdlib `unittest`.
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "T20", "ANN"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
