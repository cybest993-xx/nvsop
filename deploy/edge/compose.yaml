# NVSOP 推理机（Edge）推理服务部署入口：每「主机 × 推理后端」一个独立 Compose project。
# 部署者用原生 -p/--project-name（或 COMPOSE_PROJECT_NAME）指定身份；同机多后端必须错开
# API_SERVER_PORT，GPU 由 NVIDIA_VISIBLE_DEVICES 按容量共享或分卡（不强制每后端独卡）。
# 判定与处置由本机 `python -m edge_runtime` supervisor 承担，故关闭基座 checker 与声光/
# messaging，且不引入 Kafka。主机私钥与设备凭据留在 edge_runtime 的本机只读 secret 文件，
# 不出现在本文件、Git、日志、API 或导出。
services:
  inference:
    extends:
      file: ../../vendor/sop-monitoring-blueprints/microservices/sop-inference-bp/deploy/compose.yaml
      service: nvds-action-sop
    environment:
      DISABLE_SOP_CHECKER: "true"
      ENABLE_ALERT_SOUND: "false"
      ENABLE_MESSAGING: "false"
      # 不继承部署者 shell 中可能存在的 NGC 凭据；模型改为本机只读挂载。
      NGC_API_KEY: ""
      API_SERVER_PORT: "${API_SERVER_PORT:-8300}"
      NVIDIA_VISIBLE_DEVICES: "${NVIDIA_VISIBLE_DEVICES:-0}"
      # 固定容器内模板/提示词路径，避免部署者 shell 变量把只读挂载目标改到不存在的位置。
      ACTION_CONFIG_PATH: "/opt/nvidia/nvds_sop/configs/actions.json"
      VLM_PROMPT_PATH: "/opt/nvidia/nvds_sop/configs/vlm_prompts.txt"
    # 本系统不用基座自带 Kafka broker；messaging 关闭后没有固定容器与依赖。
    depends_on: !reset []
    # 声光处置关闭，不需要宿主声卡。
    devices: !reset []
    # 模型根只读挂到 /models，与基座 DDM/VLLM 默认路径一致；模板与提示词同样只读。
    volumes: !override
      - "${MODEL_ROOT_DIR:-/models}:/models:ro"
      - "${NVSOP_EDGE_ACTION_CONFIG:-/srv/nvsop/edge/actions.json}:/opt/nvidia/nvds_sop/configs/actions.json:ro"
      - "${NVSOP_EDGE_VLM_PROMPT:-/srv/nvsop/edge/vlm_prompts.txt}:/opt/nvidia/nvds_sop/configs/vlm_prompts.txt:ro"
