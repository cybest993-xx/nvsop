name: nvsop-dev-main

# 本地网关默认由 scripts/dev.py 渲染为 HTTP；显式设置 NVSOP_DEV_PROTOCOL=https 才启用固定 main 本地 TLS。
#
# 中心 runtime（API / worker / bootstrap）共用环境。数据库运行身份是 `nvsop_runtime`，
# 与 `center-migrate` 的安装身份 `nvsop` 分离；密码只经独立 secret 文件注入（S065）。
x-center-environment: &center-environment
  SOP_DATABASE_HOST: center-db
  SOP_DATABASE_PORT: "5432"
  SOP_DATABASE_NAME: nvsop
  SOP_DATABASE_USER: nvsop_runtime
  SOP_DATABASE_PASSWORD_FILE: /run/secrets/nvsop-runtime-password
  SOP_REDIS_URL_FILE: /run/secrets/redis-url
  SOP_DATASET_STORAGE_ROOT: /var/lib/nvsop/dataset-files
  SOP_CSRF_SECRET_FILE: /run/secrets/csrf-secret
  SOP_DEPLOYMENT_MODE: fixed_main
  SOP_SESSION_COOKIE_TRANSPORT: ${NVSOP_DEV_COOKIE_TRANSPORT:-allow_http}
  SOP_SESSION_IDLE_TIMEOUT_MINUTES: "30"
  SOP_SESSION_ABSOLUTE_LIFETIME_MINUTES: "480"
  SOP_DATASET_UPLOAD_TTL_SECONDS: "900"
  SOP_DATASET_MAX_UPLOAD_BYTES: "8589934592"
  SOP_DATASET_SUPPORTED_CODECS: h264,h265
  SOP_MEDIA_PROBE_TIMEOUT_SECONDS: "60"
  SOP_ANNOTATION_BACKEND_URL: http://annotation-backend:8100
  SOP_ANNOTATION_MEDIA_ORIGIN: ${NVSOP_DEV_MEDIA_URL:-http://localhost:8444}
  SOP_ANNOTATION_DATA_ROOT: /var/lib/nvsop/annotation-data
  SOP_ANNOTATION_HTTP_TIMEOUT_SECONDS: "120"
  SOP_MEDIA_PROBE_BINARY: ffprobe
  SOP_WORKER_HEALTH_CHECK_INTERVAL_SECONDS: "5"
  SOP_LOG_LEVEL: info
  NO_PROXY: center-db,redis,annotation-backend,localhost,127.0.0.1
  no_proxy: center-db,redis,annotation-backend,localhost,127.0.0.1

services:
  center-db:
    # 中心实例自带 TimescaleDB（S020）。固定具体标签，扩展由迁移中的 CREATE EXTENSION 安装；
    # 一次性 client-only 服务（建库/角色/对象安装）仍用普通 postgres 镜像，只做客户端。
    image: timescale/timescaledb:2.22.1-pg17
    environment:
      POSTGRES_DB: nvsop
      POSTGRES_USER: nvsop
      POSTGRES_PASSWORD_FILE: /run/secrets/center-db-password
    secrets:
      - center-db-password
    volumes:
      - center-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nvsop -d nvsop"]
      interval: 3s
      timeout: 3s
      retries: 30

  # Q35：同一 PostgreSQL 实例内的第二个 database。训练/标注进程连接 `training`，
  # Center 只连接 `nvsop`。幂等创建以兼容既有数据卷；training 对象安装由 #224(S066) 负责，
  # 这里不执行 DDL，也不重建/清空中心数据卷。用 `TEMPLATE template0` 建库：TimescaleDB
  # 镜像会把扩展装进 template1 与默认库，若照抄 template1，training 会继承扩展而不再是普通库。
  training-db-init:
    image: postgres:17.2-bookworm
    depends_on:
      center-db:
        condition: service_healthy
    environment:
      PGHOST: center-db
      PGUSER: nvsop
      PGDATABASE: nvsop
    secrets:
      - center-db-password
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        export PGPASSWORD="$$(cat /run/secrets/center-db-password)"
        if psql -tAc "SELECT 1 FROM pg_database WHERE datname = 'training'" | grep -qx 1; then
          echo "training database already present"
        else
          psql -v ON_ERROR_STOP=1 -c "CREATE DATABASE training TEMPLATE template0"
        fi
    restart: "no"

  # S065：用安装身份在 `nvsop` 上建立 Center runtime 的非超级用户权限。
  # 幂等：可重复运行；密码只从 secret 文件读入环境，不进入命令行或日志。
  # 不依赖 `training-db-init`，Center 启动不等训练库。
  center-role-init:
    image: postgres:17.2-bookworm
    depends_on:
      center-db:
        condition: service_healthy
    environment:
      PGHOST: center-db
      PGUSER: nvsop
    secrets:
      - center-db-password
      - nvsop-runtime-password
    volumes:
      - ./db-roles.sql:/opt/nvsop/db-roles.sql:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        export PGPASSWORD="$$(cat /run/secrets/center-db-password)"
        export RUNTIME_PASSWORD="$$(cat /run/secrets/nvsop-runtime-password)"
        psql -v ON_ERROR_STOP=1 -v database=nvsop -v runtime_role=nvsop_runtime -d nvsop -f /opt/nvsop/db-roles.sql
    restart: "no"

  # S065：在 `training` database 上建立训练 runtime 的非超级用户权限。
  training-role-init:
    image: postgres:17.2-bookworm
    depends_on:
      training-db-init:
        condition: service_completed_successfully
    environment:
      PGHOST: center-db
      PGUSER: nvsop
    secrets:
      - center-db-password
      - training-runtime-password
    volumes:
      - ./db-roles.sql:/opt/nvsop/db-roles.sql:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        export PGPASSWORD="$$(cat /run/secrets/center-db-password)"
        export RUNTIME_PASSWORD="$$(cat /run/secrets/training-runtime-password)"
        psql -v ON_ERROR_STOP=1 -v database=training -v runtime_role=training_runtime -d training -f /opt/nvsop/db-roles.sql
    restart: "no"

  # S066：在空 `training` database 上安装五类训练/标注进程所需对象。
  # DDL 复用 Vendor 合并脚本并锁定其提交/摘要；重复启动跳过，未知非空/部分状态明确拒绝。
  training-objects-install:
    image: postgres:17.2-bookworm
    depends_on:
      training-role-init:
        condition: service_completed_successfully
    environment:
      PGHOST: center-db
      PGUSER: nvsop
      PGDATABASE: training
      NVSOP_TRAINING_VENDOR_COMMIT: "69352021c2aae0ba071acd2629f5cff224d14ca6"  # pragma: allowlist secret
      NVSOP_TRAINING_DDL_PATH: vendor/sop-monitoring-blueprints/microservices/sop-training-bp/db-init-scripts/01-init-tables.sql
      NVSOP_TRAINING_DDL_SHA256: "df3e518f7becfad1adb3f785e75cf4a254d8e82faccb76513c03d6af9b7c3d12"  # pragma: allowlist secret
    secrets:
      - center-db-password
    volumes:
      - ./training-install.sh:/opt/nvsop/training-install.sh:ro
      - ./training-install-version.sql:/opt/nvsop/training-install-version.sql:ro
      - ../../vendor/sop-monitoring-blueprints/microservices/sop-training-bp/db-init-scripts/01-init-tables.sql:/opt/nvsop/training-ddl/01-init-tables.sql:ro
    entrypoint: ["/bin/sh", "/opt/nvsop/training-install.sh"]
    restart: "no"

  redis:
    image: redis:7.4.2-bookworm
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30

  center-migrate:
    image: nvsop-dev-main/center-api:${NVSOP_TARGET_SHA:-local}
    depends_on:
      center-db:
        condition: service_healthy
      center-role-init:
        condition: service_completed_successfully
    environment:
      <<: *center-environment
      # Alembic 以安装身份迁移；runtime 没有 DDL 权限。
      SOP_DATABASE_USER: nvsop
      SOP_DATABASE_PASSWORD_FILE: /run/secrets/center-db-password
    secrets:
      - center-db-password
      - redis-url
      - csrf-secret
    command: ["alembic", "-c", "/app/apps/control-api/alembic.ini", "upgrade", "head"]
    restart: "no"

  center-bootstrap:
    image: nvsop-dev-main/center-api:${NVSOP_TARGET_SHA:-local}
    depends_on:
      center-migrate:
        condition: service_completed_successfully
    environment:
      <<: *center-environment
      NVSOP_BOOTSTRAP_LOGIN_NAME: ${NVSOP_DEV_LOGIN_NAME:-dev.admin}
      NVSOP_BOOTSTRAP_DISPLAY_NAME: 开发环境管理员
      NVSOP_BOOTSTRAP_PASSWORD_FILE: /run/secrets/bootstrap-password
    secrets:
      - nvsop-runtime-password
      - redis-url
      - csrf-secret
      - bootstrap-password
    command: ["python", "-m", "factory_sop.bootstrap", "--login-name", "${NVSOP_DEV_LOGIN_NAME:-dev.admin}", "--display-name", "开发环境管理员", "--password-file", "/run/secrets/bootstrap-password"]
    restart: "no"

  center-api:
    image: nvsop-dev-main/center-api:${NVSOP_TARGET_SHA:-local}
    build:
      # 某些 Docker 主机只能通过 host 网络访问软件包镜像。
      # 该设置只影响镜像构建，运行时服务仍保留 Compose 网络。
      network: ${NVSOP_DEV_BUILD_NETWORK:-default}
      context: ${NVSOP_SOURCE_DIR:-.}
      dockerfile: deploy/dev/center.Dockerfile
    depends_on:
      center-bootstrap:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment: *center-environment
    volumes:
      - dataset-media:/var/lib/nvsop/dataset-files
    secrets:
      - nvsop-runtime-password
      - redis-url
      - csrf-secret
    command: ["uvicorn", "factory_sop.entrypoint:build", "--factory", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD", "curl", "--noproxy", "*", "-fsS", "http://127.0.0.1:8000/api/v1/liveness"]
      interval: 3s
      timeout: 3s
      retries: 30

  worker:
    image: nvsop-dev-main/center-api:${NVSOP_TARGET_SHA:-local}
    depends_on:
      center-bootstrap:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      annotation-backend:
        condition: service_healthy
    environment: *center-environment
    volumes:
      - dataset-media:/var/lib/nvsop/dataset-files
      - annotation-media:/var/lib/nvsop/annotation-data:ro
    secrets:
      - nvsop-runtime-password
      - redis-url
      - csrf-secret
    command: ["python", "-m", "factory_sop.worker_entrypoint"]
    healthcheck:
      test: ["CMD", "python", "-m", "factory_sop.job.adapters.healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  annotation-backend:
    image: nvsop-dev-main/annotation-backend:${NVSOP_TARGET_SHA:-local}
    build:
      network: ${NVSOP_DEV_BUILD_NETWORK:-default}
      context: ${NVSOP_SOURCE_DIR:-.}
      dockerfile: deploy/dev/annotation-backend.Dockerfile
    depends_on:
      training-objects-install:
        condition: service_completed_successfully
    environment:
      # 训练/标注进程经 Vendor `POSTGRES_*` seam 以 `training_runtime` 非超级用户连接 `training`。
      POSTGRES_HOST: center-db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: training
      POSTGRES_USER: training_runtime
      POSTGRES_PASSWORD_FILE: /run/secrets/training-runtime-password
      SERVICE_PORT: "8100"
      MAX_REQUEST_BODY_MB: "2048"
    secrets:
      - training-runtime-password
    volumes:
      - annotation-media:/app/assets/videos
    healthcheck:
      test: ["CMD", "curl", "--noproxy", "*", "-fsS", "http://127.0.0.1:8100/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 30

  annotation-frontend:
    image: nvsop-dev-main/annotation-frontend:${NVSOP_TARGET_SHA:-local}
    build:
      network: ${NVSOP_DEV_BUILD_NETWORK:-default}
      context: ${NVSOP_SOURCE_DIR:-.}
      dockerfile: deploy/dev/annotation-frontend.Dockerfile
    healthcheck:
      test: ["CMD", "wget", "-Y", "off", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    image: nvsop-dev-main/web:${NVSOP_TARGET_SHA:-local}
    build:
      network: ${NVSOP_DEV_BUILD_NETWORK:-default}
      context: ${NVSOP_SOURCE_DIR:-.}
      dockerfile: deploy/dev/web.Dockerfile
    healthcheck:
      test: ["CMD", "wget", "-Y", "off", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 5s
      timeout: 3s
      retries: 20

  gateway:
    image: nginx:1.27.3-alpine
    depends_on:
      center-api:
        condition: service_healthy
      worker:
        condition: service_healthy
      annotation-backend:
        condition: service_healthy
      annotation-frontend:
        condition: service_healthy
      web:
        condition: service_healthy
    ports:
      - "127.0.0.1:8443:8443"
      - "127.0.0.1:8444:8444"
    volumes:
      - ${NVSOP_DEV_NGINX_CONFIG:-.nvsop/dev-main/nginx.conf}:/etc/nginx/conf.d/default.conf:ro
      - ${NVSOP_DEV_STATE_DIR:-.nvsop/dev-main}/tls:/etc/nginx/tls:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -Y off -q --no-check-certificate -O - ${NVSOP_DEV_PROTOCOL:-http}://127.0.0.1:8443/api/v1/liveness >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  center-db-data:
    name: nvsop-dev-main-center-db
  redis-data:
    name: nvsop-dev-main-redis
  dataset-media:
    name: nvsop-dev-main-dataset-media
  annotation-media:
    name: nvsop-dev-main-annotation-media

secrets:
  center-db-password:
    file: ${NVSOP_DEV_STATE_DIR:-.nvsop/dev-main}/secrets/center-db-password
  nvsop-runtime-password:
    file: ${NVSOP_DEV_STATE_DIR:-.nvsop/dev-main}/secrets/nvsop-runtime-password
  training-runtime-password:
    file: ${NVSOP_DEV_STATE_DIR:-.nvsop/dev-main}/secrets/training-runtime-password
  bootstrap-password:
    file: ${NVSOP_DEV_STATE_DIR:-.nvsop/dev-main}/secrets/bootstrap-password
  csrf-secret:
    file: ${NVSOP_DEV_STATE_DIR:-.nvsop/dev-main}/secrets/csrf-secret
  redis-url:
    file: ${NVSOP_DEV_STATE_DIR:-.nvsop/dev-main}/secrets/redis-url
