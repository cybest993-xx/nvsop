# Alembic's configuration. One linear history in one `versions/` directory (§六); the module
# each migration belongs to is the second field of its filename, which is what makes ownership
# statically decidable (`scripts/check_migration_ownership.py`).
#
# There is no `sqlalchemy.url` here. The database is configured by environment variables
# through the one `Settings` object (§六), so `migrations/env.py` resolves it the same way the
# application does — a URL in this file would be a second place a credential lives, and it
# would be the one committed to Git.

[alembic]
script_location = migrations
prepend_sys_path = src
path_separator = os
# `<sequence>_<module>_<slug>`, matching what the ownership check parses. The date is not in
# the name: the sequence is what orders the history, and two names carrying different
# information about order would eventually disagree.
file_template = %%(rev)s_%%(slug)s
timezone = UTC

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = plain

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = plain

[formatter_plain]
format = %(levelname)s %(name)s %(message)s
