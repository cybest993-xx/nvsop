# 落地队列控制器：GitHub 是持久真源，仓库状态分支 + issue 评论 inbox 保存队列状态与唤醒请求。
# 该 workflow 运行默认分支上的可信代码，是队列状态分支的唯一写入者；全局 concurrency 只是互斥，
# 不是排序。队列 ACTIVE 项通过可复用调用触发 blocking-ci，blocking-ci 自身不再监听 PR/push。
name: landing-queue

on:
  # 入队/出队唤醒请求只接受队列 inbox issue 上的评论。
  issue_comment:
    types: [created, edited]
  # 候选头、关闭、编辑、重开、就绪等 PR 事件都可能是落地状态变化。
  # 不使用 pull_request_review：它可能执行候选工作流代码并暴露 App secret；finalize 自行读取 review。
  pull_request_target:
    types: [synchronize, closed, edited, reopened, ready_for_review]
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

# 全局互斥：保证同一时刻只有一个控制器在推进队列；不提供排序，排序由持久 inbox/状态提供。
concurrency:
  group: landing-queue
  cancel-in-progress: false

jobs:
  # 部署前守卫：LANDING_APP_ID / LANDING_QUEUE_ISSUE 未配置时不请求 App secret、不运行作业。
  # 与 main-only 和 inbox 过滤共用；服务端配置完成后正常处理 App refresh/synchronize 与入队。
  guard:
    name: Landing controller guard
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    if: >-
      github.ref == 'refs/heads/main' &&
      vars.LANDING_APP_ID != '' &&
      vars.LANDING_QUEUE_ISSUE != '' &&
      (github.event_name != 'issue_comment' ||
      format('{0}', github.event.issue.number) == vars.LANDING_QUEUE_ISSUE)
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        run: echo "enabled=true" >> "$GITHUB_OUTPUT"

  prepare:
    name: Prepare landing phase
    needs: guard
    runs-on: ubuntu-24.04
    # 特权作业绑定受保护环境 `landing`（仅 main），App 私钥从环境 secret 读取。
    environment: landing
    timeout-minutes: 10
    if: needs.guard.outputs.enabled == 'true'
    outputs:
      run_ci: ${{ steps.prepare.outputs.run_ci }}
      active_pr: ${{ steps.prepare.outputs.active_pr }}
      head: ${{ steps.prepare.outputs.head }}
      base: ${{ steps.prepare.outputs.base }}
    steps:
      - name: Mint landing App token
        id: app
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.LANDING_APP_ID }}
          private-key: ${{ secrets.LANDING_APP_PRIVATE_KEY }}
      - name: Checkout trusted workflow commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # 固定触发本运行的 workflow 提交，避免 main 在 job 之间被替换。
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Consume requests and drive the ACTIVE phase
        id: prepare
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          LANDING_QUEUE_ISSUE: ${{ vars.LANDING_QUEUE_ISSUE }}
          LANDING_APP_ID: ${{ vars.LANDING_APP_ID }}
          LANDING_APP_BOT: ${{ vars.LANDING_APP_BOT }}
          # 受控 update-branch 证明：仅接受指定 App bot 的 synchronize 事件。
          # EVENT_PR 绑定事件所属 PR，同一 SHA 的其它 PR 事件不能代签。
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_AFTER: ${{ github.event.after }}
          EVENT_ACTOR: ${{ github.event.sender.login }}
          EVENT_PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          output="$(python3 scripts/landing_queue.py prepare \
            --run-id "${{ github.run_id }}" \
            --attempt "${{ github.run_attempt }}" \
            --controller-sha "${{ github.workflow_sha }}")"
          printf '%s\n' "$output"
          extract() { printf '%s\n' "$output" | sed -n "s/^$1=//p" | tail -n1; }
          run_ci="$(extract run_ci)"; run_ci="${run_ci:-false}"
          active_pr="$(extract active)"; active_pr="${active_pr:-none}"
          head="$(extract head)"; head="${head:-none}"
          base="$(extract base)"; base="${base:-none}"
          {
            echo "run_ci=$run_ci"
            echo "active_pr=$active_pr"
            echo "head=$head"
            echo "base=$base"
          } >> "$GITHUB_OUTPUT"

  ci:
    name: Single-flight blocking CI
    needs: prepare
    if: needs.prepare.outputs.run_ci == 'true'
    permissions:
      contents: read
    # 可复用工作流不继承 secret；候选代码只读检出，绝不携带特权。
    uses: ./.github/workflows/blocking-ci.yml
    with:
      head_sha: ${{ needs.prepare.outputs.head }}
      base_sha: ${{ needs.prepare.outputs.base }}

  finalize:
    name: Publish gates and merge
    needs: [prepare, ci]
    if: >-
      always() &&
      needs.prepare.outputs.run_ci == 'true' &&
      needs.prepare.outputs.active_pr != 'none'
    runs-on: ubuntu-24.04
    # 特权作业绑定受保护环境 `landing`（仅 main），App 私钥从环境 secret 读取。
    environment: landing
    timeout-minutes: 10
    steps:
      - name: Mint landing App token
        id: app
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.LANDING_APP_ID }}
          private-key: ${{ secrets.LANDING_APP_PRIVATE_KEY }}
      - name: Checkout trusted workflow commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Finalize the ACTIVE entry
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          LANDING_QUEUE_ISSUE: ${{ vars.LANDING_QUEUE_ISSUE }}
          LANDING_APP_ID: ${{ vars.LANDING_APP_ID }}
          ACTIVE_PR: ${{ needs.prepare.outputs.active_pr }}
          CI_RESULT: ${{ needs.ci.result }}
        run: |
          set -euo pipefail
          python3 scripts/landing_queue.py finalize \
            --pr "$ACTIVE_PR" \
            --run-id "${{ github.run_id }}" \
            --attempt "${{ github.run_attempt }}" \
            --ci-result "$CI_RESULT"

  # push main 只做轻量完整性：校验已记录的合并证明，不运行昂贵家族。
  integrity:
    name: Queue integrity
    needs: guard
    if: >-
      needs.guard.outputs.enabled == 'true' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    # 特权作业绑定受保护环境 `landing`（仅 main），App 私钥从环境 secret 读取。
    environment: landing
    timeout-minutes: 5
    steps:
      - name: Mint landing App token
        id: app
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.LANDING_APP_ID }}
          private-key: ${{ secrets.LANDING_APP_PRIVATE_KEY }}
      - name: Checkout trusted workflow commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Verify recorded merge proof
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          LANDING_QUEUE_ISSUE: ${{ vars.LANDING_QUEUE_ISSUE }}
          LANDING_APP_ID: ${{ vars.LANDING_APP_ID }}
        run: python3 scripts/landing_queue.py verify-main --sha "${{ github.sha }}"
